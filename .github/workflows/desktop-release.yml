# Build installable Desktop previews on demand and publish the exact matrix
# artifacts when the workflow runs from a desktop-v* tag.
name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - desktop-v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-14
            target: --mac
          - label: Windows
            os: windows-2025
            target: --win
          - label: Linux
            os: ubuntu-24.04
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Harness and Desktop
        run: pnpm run build

      - name: Verify Desktop runtime closure
        run: pnpm run verify-runtime-closure

      - name: Package Desktop
        shell: bash
        run: pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder ${{ matrix.target }} --publish never

      - name: Smoke packaged Desktop
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a pnpm --filter @deepseek-ai/dsh-desktop run smoke:packaged
          else
            pnpm --filter @deepseek-ai/dsh-desktop run smoke:packaged
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ runner.os }}
          path: |
            .artifacts/desktop/*.dmg
            .artifacts/desktop/*.zip
            .artifacts/desktop/*.exe
            .artifacts/desktop/*.AppImage
            .artifacts/desktop/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-*
          path: .artifacts/release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" .artifacts/release/* --generate-notes --prerelease
