# Build installable Desktop packages on demand and publish the exact matrix
# after a version-matched desktop-v* tag passes every packaged smoke.
name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - desktop-v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  plan:
    name: Plan Desktop release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Verify release version
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$REF_TYPE" == 'tag' ]]; then
            expected="desktop-v$version"
            if [[ "$REF_NAME" != "$expected" ]]; then
              echo "Desktop release tag '$REF_NAME' must match app version '$expected'." >&2
              exit 1
            fi
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-14
            target: --mac
          - label: Windows
            os: windows-2025
            target: --win
          - label: Linux
            os: ubuntu-24.04
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Harness and Desktop
        run: pnpm run build

      - name: Verify Desktop runtime closure
        run: pnpm run verify-runtime-closure

      - name: Package Desktop
        shell: bash
        run: pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder ${{ matrix.target }} --publish never

      - name: Prepare Linux Chromium sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sandbox=.artifacts/desktop/linux-unpacked/chrome-sandbox
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%U:%G %a' "$sandbox")" = 'root:root 4755'

      - name: Smoke packaged Desktop
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a pnpm --filter @deepseek-ai/dsh-desktop run smoke:packaged
          else
            pnpm --filter @deepseek-ai/dsh-desktop run smoke:packaged
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ runner.os }}
          path: |
            .artifacts/desktop/*.dmg
            .artifacts/desktop/*.zip
            .artifacts/desktop/*.exe
            .artifacts/desktop/*.AppImage
            .artifacts/desktop/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs:
      - plan
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-*
          path: .artifacts/release
          merge-multiple: true

      - name: Create checksums
        working-directory: .artifacts/release
        run: sha256sum * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: gh release create "$TAG" .artifacts/release/* --generate-notes --latest --title "DSH Desktop v$VERSION" --verify-tag
