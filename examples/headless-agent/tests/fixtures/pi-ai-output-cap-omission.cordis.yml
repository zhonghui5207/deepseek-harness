- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-pi-ai
            name: '@deepseek-ai/dsh-llm-pi-ai'
            config:
              providers:
                strict-gateway:
                  apiKeyEnv: PI_SNAPSHOT_KEY
                  api: openai-responses
                  baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
                  models:
                    - id: strict-model
                      contextWindow: 1050000
                      maxTokens: 128000
                      omitMaxOutputTokens: true
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: strict-gateway
              model: strict-model
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless pi-ai output-cap omission snapshot.'
      - id: persistence
        config:
          root: './.sessions'
